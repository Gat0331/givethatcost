<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost & Found — Listings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand__initial">LF</span>
        <span class="brand__text">Lost & Found</span>
      </a>

      <nav aria-label="Primary">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
          Menu
        </button>
        <div id="nav-menu" class="nav-menu" data-open="false">
          <a href="index.html" class="nav-link">Home</a>
          <a href="listings.html" class="nav-link">Listings</a>
          <a href="forum.html" class="nav-link">Forum</a>
          <a href="calculator.html" class="nav-link">Calculator</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="listings" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Listings</h2>
          <p class="section-subtitle">Browse reported lost or found items by category.</p>
        </div>

        <div class="category-buttons" role="tablist" aria-label="Categories">
          <button class="chip category-btn" data-cat="All">All</button>
          <button class="chip category-btn" data-cat="Wallets">Wallets</button>
          <button class="chip category-btn" data-cat="Gadgets">Gadgets</button>
          <button class="chip category-btn" data-cat="Belongings">Belongings</button>
        </div>

        <div class="listings-grid" id="listings-grid" aria-live="polite"></div>

        <div class="new-listing">
          <h3>Report an item (visual demo)</h3>
          <form id="listing-form">
            <label>
              <span>Type</span>
              <select id="listing-type">
                <option value="Missing">Missing</option>
                <option value="Found">Found</option>
              </select>
            </label>
            <label>
              <span>Category</span>
              <select id="listing-category">
                <option>Wallets</option>
                <option>Gadgets</option>
                <option>Belongings</option>
              </select>
            </label>
            <label>
              <span>Title</span>
              <input id="listing-title" type="text" placeholder="e.g. Black leather wallet" required />
            </label>
            <label>
              <span>Description</span>
              <textarea id="listing-desc" rows="3" placeholder="Where/when it was lost or found"></textarea>
            </label>
            <label>
              <span>Contact (optional)</span>
              <input id="listing-contact" type="text" placeholder="Phone or email" />
            </label>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-primary" type="submit">Add Listing</button>
              <button class="btn btn-ghost" id="clear-listings" type="button">Clear All (dev)</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Lost & Found</span>
      <span class="muted">Community-driven demo</span>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="listings.js"></script>
</body>
</html>
