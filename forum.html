<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost & Found — Forum</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand__initial">LF</span>
        <span class="brand__text">Lost & Found</span>
      </a>

      <nav aria-label="Primary">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
          Menu
        </button>
        <div id="nav-menu" class="nav-menu" data-open="false">
          <a href="index.html" class="nav-link">Home</a>
          <a href="listings.html" class="nav-link">Listings</a>
          <a href="forum.html" class="nav-link">Forum</a>
          <a href="calculator.html" class="nav-link">Calculator</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="forum" class="section section--alt">
      <div class="container">
        <div class="section-head">
          <h2>Forum</h2>
          <p class="section-subtitle">Post if you've found an item or are missing something — community members can comment.</p>
        </div>

        <div class="forum">
          <div class="forum-form">
            <h3>Create a post</h3>
            <form id="forum-form">
              <label>
                <span>Post type</span>
                <select id="post-type">
                  <option value="Missing">Missing</option>
                  <option value="Found">Found</option>
                </select>
              </label>
              <label>
                <span>Title</span>
                <input id="post-title" type="text" required />
              </label>
              <label>
                <span>Details</span>
                <textarea id="post-body" rows="4" required></textarea>
              </label>
              <label>
                <span>Contact (optional)</span>
                <input id="post-contact" type="text" />
              </label>
              <button class="btn btn-primary" type="submit">Post to Forum</button>
            </form>
          </div>

          <div class="forum-list" id="forum-list" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Lost & Found</span>
      <span class="muted">Community-driven demo</span>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="forum.js"></script>
</body>
</html>
